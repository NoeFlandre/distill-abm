site_name: distill-abm
site_description: Reproducible ABM-to-LLM distillation workflows and research documentation.
site_url: https://noeflandre.github.io/distill-abm/
repo_name: NoeFlandre/distill-abm
repo_url: https://github.com/NoeFlandre/distill-abm
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

exclude_docs: |
  superpowers/

nav:
  - Home: README.md
  - Getting started: getting-started.md
  - Pipeline and architecture: ARCHITECTURE.md
  - CLI reference: cli-reference.md
  - Configuration: CONFIG_REFERENCE.md
  - Results and synchronization: RESULTS_BUCKET.md
  - Development: development.md
  - Supplementary material:
      - Overview: supplementary-material.md
      - Testing and code verification: supplementary_material/TESTING_REPORT.md
  - Citation: citation.md
